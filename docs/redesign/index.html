<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>helm redesign prototype</title>
<meta name="theme-color" content="#eceef0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1e22" media="(prefers-color-scheme: dark)">
<meta name="description" content="Clickable mobile-first redesign of the helm homelab dashboard, with sample data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400..700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: phone-first pages with a bottom tab bar; at ≥860px of app width the
   tab bar becomes a top nav and lists flow into columns. Color = data or state. */
:root {
  --bg: #eceef0;
  --surface: #ffffff;
  --sunken: #e2e5e8;
  --ink: #15181b;
  --ink-2: #464c53;
  --muted: #6b727a;
  --line: rgba(21, 24, 27, 0.12);
  --tape: #15181b;
  --tape-ink: #f4f5f6;
  --stage: #d9dde1;
  --scrim: rgba(21, 24, 27, 0.32);
  --shadow: 0 1px 2px rgba(30, 40, 52, 0.06), 0 8px 24px rgba(30, 40, 52, 0.08);

  --s1: #2a6fc9;
  --s2: #c24a1b;
  --s3: #12855d;

  --good: #0a8a0a;
  --warning: #a86f00;
  --serious: #c2582b;
  --critical: #c02f2f;

  --term-bg: #15181b;
  --term-ink: #dfe3e6;

  /* Quicksand for words, Space Mono for numbers, machine labels and anything
     you'd type or read in a shell. */
  --font: "Quicksand", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --r-sm: 6px;
  --r-md: 12px;
  --r-lg: 20px;

  --z-nav: 10;
  --z-scrim: 20;
  --z-sheet: 30;
  --z-toast: 40;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1e22; --surface: #22272c; --sunken: #15181b;
    --ink: #eef0f2; --ink-2: #b4bac1; --muted: #8a929a;
    --line: rgba(238, 240, 242, 0.1);
    --tape: #eceee6; --tape-ink: #15181b;
    --stage: #0f1215; --scrim: rgba(0, 0, 0, 0.5);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --good: #2bb32b; --warning: #fab219; --serious: #ec835a; --critical: #e05252;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1e22; --surface: #22272c; --sunken: #15181b;
  --ink: #eef0f2; --ink-2: #b4bac1; --muted: #8a929a;
  --line: rgba(238, 240, 242, 0.1);
  --tape: #eceee6; --tape-ink: #15181b;
  --stage: #0f1215; --scrim: rgba(0, 0, 0, 0.5);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --good: #2bb32b; --warning: #fab219; --serious: #ec835a; --critical: #e05252;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--stage);
  color: var(--ink);
  font-family: var(--font);
  font-weight: 500;
  font-size: 15px;
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
button, a, input { touch-action: manipulation; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

/* ---------- review bar (not part of the design) ---------- */
.review {
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding-inline: 16px;
  font-size: 13px;
  color: var(--muted);
}
.review .seg { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 3px; border: 1px solid var(--line); }
.review .seg button { border: 0; background: none; padding: 4px 12px; border-radius: 999px; color: var(--ink-2); }
.review .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.review .hint { display: none; }
@media (min-width: 720px) { .review .hint { display: inline; } }
@media (max-width: 719px) { .review .preview-seg { display: none; } }

.stage { height: 100%; }
.frame { height: calc(100% - 48px); display: flex; justify-content: center; }
.stage.phone .frame { padding-block: 4px 24px; }

/* ---------- app shell ---------- */
.app {
  container: app / inline-size;
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  overflow: hidden;
}
.stage.phone .app {
  width: 390px;
  max-width: 100%;
  border-radius: 36px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}

.top {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 14px 20px 10px;
  flex-shrink: 0;
}
.brand { font-family: var(--font-mono); font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }
.topnav { display: none; gap: 4px; }
.topnav a {
  text-decoration: none; color: var(--ink-2); padding: 6px 12px; border-radius: 999px; font-size: 14px;
  transition: background 0.2s, color 0.2s;
}
.topnav a:hover { background: var(--sunken); color: var(--ink); }
.topnav a[aria-current="page"] { background: var(--ink); color: var(--bg); }
.live { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }

.view {
  outline: none;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 4px 16px 24px;
  scroll-behavior: smooth;
}
.view-inner { max-width: 1180px; margin-inline: auto; display: flex; flex-direction: column; gap: 28px; }

.tabbar {
  flex-shrink: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--line);
  background: var(--surface);
  padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px));
  z-index: var(--z-nav);
}
.tabbar a {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  text-decoration: none; color: var(--muted); font-size: 11.5px; padding: 6px 0; border-radius: var(--r-md);
}
.tabbar a svg { width: 24px; height: 24px; }
.tabbar a[aria-current="page"] { color: var(--ink); font-weight: 600; }
.tabbar a[aria-current="page"] .ico { background: var(--sunken); }
.tabbar .ico { padding: 3px 16px; border-radius: 999px; display: grid; place-items: center; transition: background 0.2s; }

@container app (min-width: 860px) {
  .topnav { display: flex; }
  .tabbar { display: none; }
  .top { padding: 18px 32px 14px; }
  .view { padding: 8px 32px 40px; }
}

/* ---------- shared pieces ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 4px; }
.page-head h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.1; }
.page-head .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
.section-title { font-size: 17px; font-weight: 650; margin-bottom: 10px; display: flex; align-items: baseline; gap: 8px; }
.section-title .count { color: var(--muted); font-weight: 400; font-size: 14px; }

.tape {
  display: inline-block;
  background: var(--tape);
  color: var(--tape-ink);
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 14px;
  line-height: 1;
  padding: 6px 10px 5px;
  border-radius: 3px;
  transform: rotate(-0.8deg);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 1px 0 rgba(0, 0, 0, 0.12);
  letter-spacing: 0.01em;
}
.tape.big { font-size: 20px; padding: 8px 14px 7px; }

.state { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 550; }
.state i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.state.good { color: var(--good); }
.state.warning { color: var(--warning); }
.state.critical { color: var(--critical); }
.state.muted { color: var(--muted); }

.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 8px 16px;
  font-size: 14px;
  font-weight: 550;
  transition: background 0.2s, transform 0.1s;
  white-space: nowrap;
}
a.btn { text-decoration: none; color: inherit; display: inline-block; }
.btn:hover { background: var(--sunken); }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { opacity: 0.9; }
.btn.danger { color: var(--critical); }
.btn.armed { background: var(--critical); border-color: var(--critical); color: #fff; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
.link:hover { color: var(--ink); }
.iconbtn { border: 0; background: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex-shrink: 0; transition: background 0.2s; }
.iconbtn:hover { background: var(--sunken); color: var(--ink); }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 6px 14px; font-size: 14px; color: var(--ink-2); transition: background 0.2s; }
.chip:hover { background: var(--sunken); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .n { opacity: 0.65; margin-left: 4px; }

.seg { display: inline-flex; background: var(--sunken); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.search {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 11px 18px;
  font-size: 15px;
}
.search::placeholder { color: var(--muted); }

/* ---------- attention ---------- */
.attention { display: flex; flex-direction: column; gap: 8px; }
.alert {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: start;
  gap: 4px 12px;
  background: var(--surface);
  border-radius: var(--r-md);
  padding: 14px 14px 14px 16px;
}
.alert .glyph { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; }
.alert.critical .glyph { background: color-mix(in srgb, var(--critical) 14%, transparent); color: var(--critical); }
.alert.warning .glyph { background: color-mix(in srgb, var(--warning) 16%, transparent); color: var(--warning); }
.alert .what { font-weight: 600; }
.alert > .btn { grid-column: 2; justify-self: start; margin-top: 8px; padding: 6px 14px; }
@container app (min-width: 560px) {
  .alert { grid-template-columns: auto 1fr auto; align-items: center; }
  .alert > .btn { grid-column: auto; margin-top: 0; }
}
.alert .why { color: var(--muted); font-size: 14px; }
.allclear { display: flex; align-items: center; gap: 10px; color: var(--ink-2); padding: 4px 0; }

/* ---------- machines ---------- */
.machines { display: grid; grid-template-columns: 1fr; gap: 14px; }
@container app (min-width: 860px) { .machines { grid-template-columns: 1fr 1fr; } }
.machine {
  display: flex; flex-direction: column; gap: 16px;
  background: var(--surface);
  border-radius: var(--r-lg);
  padding: 18px 18px 16px;
  text-decoration: none;
  color: inherit;
  transition: transform 0.15s, box-shadow 0.2s;
}
.machine:hover { box-shadow: var(--shadow); }
.machine:active { transform: scale(0.99); }
.machine .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.machine .uptime { color: var(--muted); font-size: 13.5px; }
.readings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.reading .v { font-family: var(--font-mono); font-weight: 700; font-size: 26px; line-height: 1; letter-spacing: -0.04em; }
.reading .v small { font-size: 0.55em; font-weight: 600; margin-left: 1px; color: var(--ink-2); }
.reading .l { color: var(--muted); font-size: 13px; margin-top: 4px; }
.reading.warning .v { color: var(--warning); }
.reading.critical .v { color: var(--critical); }
.machine .foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; font-size: 13.5px; color: var(--muted); }

.sparkwrap { position: relative; height: 36px; }
.spark { width: 100%; height: 100%; display: block; overflow: visible; }
.spark .area { fill: color-mix(in srgb, var(--s1) 14%, transparent); }
.spark .line { fill: none; stroke: var(--s1); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.sparkwrap .dot { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--s1); transform: translate(-50%, -50%); box-shadow: 0 0 0 2px var(--surface); }

.favs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@container app (min-width: 860px) { .favs { grid-template-columns: repeat(8, 1fr); } }
.fav { border: 0; background: none; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); border-radius: var(--r-md); }
.fav:hover { background: var(--sunken); }
.mono-badge {
  width: 52px; height: 52px; border-radius: 16px;
  background: var(--surface);
  display: grid; place-items: center;
  font-weight: 700; font-size: 19px; color: var(--ink);
  position: relative;
}
.mono-badge img { width: 60%; height: 60%; object-fit: contain; }
.mono-badge.sm { width: 40px; height: 40px; border-radius: 12px; font-size: 16px; background: var(--sunken); }
.mono-badge .flag { position: absolute; right: -2px; top: -2px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--bg); }

/* ---------- apps grid ---------- */
.app-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 8px; }
@container app (min-width: 560px) { .app-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
@container app (min-width: 860px) { .app-grid { grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 24px 12px; } }
.app-tile {
  border: 0; background: none; padding: 6px 2px; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  border-radius: var(--r-md); transition: background 0.2s;
}
.app-tile:hover { background: var(--sunken); }
.app-tile:active .mono-badge { transform: scale(0.96); }
.app-tile .mono-badge { width: 100%; max-width: 64px; height: auto; aspect-ratio: 1; font-size: 20px; transition: transform 0.1s; }
.app-name { font-size: 12px; letter-spacing: -0.01em; color: var(--ink-2); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hidden-note { color: var(--muted); font-size: 14px; }

/* ---------- lists (containers) ---------- */
.group { display: flex; flex-direction: column; }
.group-title { font-size: 14px; color: var(--muted); margin: 0 4px 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.list { background: var(--surface); border-radius: var(--r-md); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 8px 10px 14px;
  min-height: 60px;
  width: 100%;
  border: 0;
  background: none;
  text-align: left;
  transition: background 0.15s;
}
.row + .row { border-top: 1px solid var(--line); }
.row:hover { background: color-mix(in srgb, var(--sunken) 60%, transparent); }
.row .main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 0; text-align: left; }
.row .txt { min-width: 0; }
.row .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .desc { color: var(--muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { color: var(--ink-2); font-size: 13.5px; text-align: right; flex-shrink: 0; }
.row .meta div + div { color: var(--muted); }
.groups { display: grid; grid-template-columns: 1fr; gap: 22px; align-items: start; }
@container app (min-width: 860px) { .groups { grid-template-columns: 1fr 1fr; } }
@container app (min-width: 1150px) { .groups.three { grid-template-columns: 1fr 1fr 1fr; } }

.note { background: var(--sunken); border-radius: var(--r-md); padding: 12px 14px; font-size: 14px; color: var(--ink-2); }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; }
.empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

/* ---------- machine detail ---------- */
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); text-decoration: none; font-size: 14px; }
.back:hover { color: var(--ink); }
.facts { display: flex; flex-direction: column; gap: 2px; color: var(--ink-2); font-size: 14px; }
.detail-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
@container app (min-width: 860px) { .detail-grid { grid-template-columns: 1fr 1fr; } }
.panel { background: var(--surface); border-radius: var(--r-lg); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel h2 { font-size: 16px; font-weight: 650; }
.headline { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.headline .big { font-family: var(--font-mono); font-weight: 700; font-size: 34px; line-height: 1; letter-spacing: -0.04em; }
.headline .say { color: var(--ink-2); font-size: 14px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px 16px; }
.kv .k { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.kv .k i { width: 8px; height: 8px; border-radius: 2px; }
.kv .v { font-size: 16px; font-weight: 550; }

.chart { position: relative; height: 120px; touch-action: pan-y; }
.chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
.chart .grid line { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.chart .ylab { position: absolute; right: 0; font-size: 11.5px; color: var(--muted); transform: translateY(-110%); background: var(--surface); padding: 0 3px; border-radius: 3px; z-index: 1; }
.chart .xh { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--muted); opacity: 0; pointer-events: none; }
.chart .hdot { position: absolute; width: 9px; height: 9px; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 2px var(--surface); opacity: 0; pointer-events: none; }
.chart .tip {
  position: absolute; top: -8px; transform: translate(-50%, -100%);
  background: var(--ink); color: var(--bg); font-size: 12.5px; padding: 6px 9px; border-radius: 8px;
  white-space: nowrap; opacity: 0; pointer-events: none;
}
.chart.hover .xh, .chart.hover .hdot, .chart.hover .tip { opacity: 1; }
.chart .tip b { font-weight: 650; }
.legend { display: flex; gap: 16px; font-size: 13.5px; color: var(--ink-2); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; }

.stack-bar { display: flex; gap: 2px; height: 14px; border-radius: 4px; overflow: hidden; }
.stack-bar span { display: block; height: 100%; }
.meter { height: 8px; background: var(--sunken); border-radius: 4px; overflow: hidden; }
.meter span { display: block; height: 100%; border-radius: 4px; background: var(--s1); }
.fs-row { display: flex; flex-direction: column; gap: 6px; }
.fs-row .top-line { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.fs-row .top-line .left { font-weight: 600; }
.fs-row .top-line .right { color: var(--ink-2); }
.sensor-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px 16px; }
.sensor-list div { display: flex; justify-content: space-between; font-size: 14px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.sensor-list span:first-child { color: var(--ink-2); }
.proc-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.proc-table th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px 0; font-size: 13px; }
.proc-table td { padding: 7px 0; border-top: 1px solid var(--line); }
.proc-table td:not(:first-child), .proc-table th:not(:first-child) { text-align: right; }
.proc-table td:first-child { max-width: 0; width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* numbers and identifiers */
.kv .v, .row .meta, .proc-table td:not(:first-child), .sensor-list span:last-child,
.fs-row .right, .chart .tip b, .chart .ylab, .chip .n, .row .desc.mono, .sheet-head .sub.mono {
  font-family: var(--font-mono);
  letter-spacing: -0.02em;
}
.kv .v { font-size: 15px; }
.row .meta, .fs-row .right, .proc-table td { font-size: 13px; }
.row .desc.mono { font-size: 11px; letter-spacing: -0.01em; }
.sheet-head .sub.mono { font-size: 12.5px; }

/* ---------- terminal ---------- */
.view.term-view { padding: 0; display: flex; flex-direction: column; }
.term-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 16px 12px; flex-wrap: wrap; }
.term-head h1 { font-size: 24px; font-weight: 700; }
.term {
  flex: 1; min-height: 0;
  margin: 0 8px;
  background: var(--term-bg);
  color: var(--term-ink);
  border-radius: var(--r-md) var(--r-md) 0 0;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.5;
  padding: 12px 12px 8px;
  overflow-y: auto;
  overflow-x: hidden;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.term .p { color: #7fd17f; }
.term .d { color: #8a929a; }
.term .e { color: #ff8a80; }
.term-input { display: flex; gap: 8px; margin: 0 8px; background: var(--term-bg); padding: 0 12px 12px; color: var(--term-ink); font-family: var(--font-mono); font-size: 12px; align-items: center; min-width: 0; }
.term-input input { flex: 1; background: none; border: 0; color: var(--term-ink); font-family: var(--font-mono); font-size: 16px; outline: none; min-width: 0; }
.term-input:focus-within { box-shadow: inset 0 -2px 0 var(--s1); }
.term-tools { padding: 10px 8px 12px; display: flex; flex-direction: column; gap: 10px; }
.term-tools .label { font-size: 13px; color: var(--muted); margin-left: 4px; }
.keys { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
.keys button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 0; font-family: var(--font-mono); font-size: 12px; min-width: 0; }
.keys button:active { transform: translateY(1px); }
@container app (min-width: 860px) {
  .term-head { padding: 4px 32px 14px; }
  .term, .term-input { margin-inline: 32px; font-size: 13px; }
  .term-tools { padding-inline: 32px; }
  .keys.modifiers { display: none; }
}

/* ---------- sheet ---------- */
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: var(--z-scrim); }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  max-height: 86%;
  background: var(--surface);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  transform: translateY(102%);
  transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  z-index: var(--z-sheet);
  display: flex; flex-direction: column;
  box-shadow: var(--shadow);
}
.sheet.open { transform: none; }
.sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 0; flex-shrink: 0; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 12px 16px 4px 20px; }
.sheet-head h2 { font-size: 22px; font-weight: 700; }
.sheet-head .sub { color: var(--muted); font-size: 14px; }
.sheet-body { overscroll-behavior: contain; padding: 8px 20px calc(20px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.logs { background: var(--term-bg); color: var(--term-ink); border-radius: var(--r-sm); padding: 12px; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; overflow-x: auto; white-space: pre; max-height: 240px; }
.logs .e { color: #ff8a80; }
.compose { width: 100%; min-height: 220px; resize: vertical; background: var(--term-bg); color: var(--term-ink); border: 0; border-radius: var(--r-sm); padding: 12px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.5; }
@container app (min-width: 860px) {
  .sheet { left: auto; top: 0; width: 420px; max-height: none; border-radius: var(--r-lg) 0 0 var(--r-lg); transform: translateX(102%); }
  .sheet .grab { display: none; }
  .sheet-head { padding-top: 22px; }
}

.toast {
  position: absolute; left: 50%; bottom: 84px; transform: translate(-50%, 20px);
  background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 999px; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
  z-index: var(--z-toast); white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@container app (min-width: 860px) { .toast { bottom: 28px; } }

.skip { position: absolute; left: 8px; top: -40px; background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 6px; z-index: 50; }
.skip:focus { top: 8px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>

  // ---------------------------------------------------------------- attention
  // Mirrors the alert rules: a crash loop is an alert, a manual stop (exited) is not.
  function attention() {
    const items = [];
    for (const c of containers) {
      if (c.status === 'restarting' || c.status === 'dead') {
        items.push({
          level: 'critical', icon: icons.bang, machine: c.machine,
          what: `${c.name} keeps restarting`,
          why: `On ${machineById(c.machine).name}, 6 restarts in 10 minutes.`,
          short: `${c.name} keeps restarting`,
          action: { label: 'View logs', act: 'ctr', id: c.name },
        });
      }
    }
    for (const m of machines) {
      for (const f of m.fs) {
        const p = fsPct(f);
        if (p >= 90) {
          items.push({
            level: 'warning', icon: icons.disk, machine: m.id,
            what: `Disk almost full on ${m.name}`,
            why: `${f.mount} is ${Math.round(p)}% full, ${gb(f.size - f.used)} left.`,
            short: `Disk ${f.mount} is ${Math.round(p)}% full`,
            action: { label: 'Open', href: `#machine-${m.id}` },
          });
        }
      }
      const t = hottest(m);
      if (t.value >= 80) {
        items.push({ level: 'warning', icon: icons.bang, machine: m.id, what: `${m.name} is running hot`, why: `${t.label} is at ${t.value}°C.`, short: `Running hot`, action: { label: 'Open', href: `#machine-${m.id}` } });
      }
    }
    return items;
  }

  // ---------------------------------------------------------------- charts
  function path(values, max, w = 100, h = 40) {
    return values.map((v, i) => `${i ? 'L' : 'M'}${((i / (values.length - 1)) * w).toFixed(2)},${(h - (Math.min(v, max) / max) * h).toFixed(2)}`).join('');
  }
  function spark(values, max) {
    const d = path(values, max, 100, 36);
    const y = 100 - (Math.min(last(values), max) / max) * 100;
    return `<div class="sparkwrap" aria-hidden="true">
      <svg class="spark" viewBox="0 0 100 36" preserveAspectRatio="none">
        <path class="area" d="${d}L100,36L0,36Z"/><path class="line" d="${d}"/>
      </svg><span class="dot" style="left:100%;top:${y}%"></span></div>`;
  }
  const niceMax = (v) => {
    const p = Math.pow(10, Math.floor(Math.log10(v || 1)));
    return [1, 2, 2.5, 5, 10].map((s) => s * p).find((s) => s >= v) || 10 * p;
  };

  const chartRegistry = {};
  function chart(key, series, { max, fmt, label }) {
    const top = max ?? niceMax(Math.max(...series.flatMap((s) => s.values)) * 1.15);
    chartRegistry[key] = { series, max: top, fmt };
    const lines = series.map((s) => `<path d="${path(s.values, top)}" fill="none" stroke="${s.color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`).join('');
    const area = series.length === 1 ? `<path d="${path(series[0].values, top)}L100,40L0,40Z" fill="color-mix(in srgb, ${series[0].color} 13%, transparent)"/>` : '';
    const ends = series.map((s) => `<span class="hdot" style="left:100%;top:${100 - (Math.min(last(s.values), top) / top) * 100}%;background:${s.color};opacity:1"></span>`).join('');
    const hdots = series.map((s, i) => `<span class="hdot" data-h="${i}" style="background:${s.color}"></span>`).join('');
    return `<div class="chart" data-chart="${key}" role="img" aria-label="${esc(label)}">
      <svg viewBox="0 0 100 40" preserveAspectRatio="none">
        <g class="grid"><line x1="0" x2="100" y1="0" y2="0"/><line x1="0" x2="100" y1="20" y2="20"/><line x1="0" x2="100" y1="40" y2="40"/></g>
        ${area}${lines}
      </svg>
      <span class="ylab" style="top:0">${fmt(top)}</span>
      <span class="ylab" style="top:50%">${fmt(top / 2)}</span>
      ${ends}<span class="xh"></span>${hdots}<span class="tip"></span>
    </div>`;
  }
  function onChartMove(e) {
    const el = e.target.closest('.chart');
    if (!el) return;
    const spec = chartRegistry[el.dataset.chart];
    if (!spec) return;
    const r = el.getBoundingClientRect();
    const x = Math.min(Math.max(e.clientX - r.left, 0), r.width);
    const i = Math.round((x / r.width) * (N - 1));
    const left = (i / (N - 1)) * 100;
    el.classList.add('hover');
    state.hovering = true;
    $('.xh', el).style.left = `${left}%`;
    spec.series.forEach((s, k) => {
      const dot = el.querySelector(`[data-h="${k}"]`);
      dot.style.left = `${left}%`;
      dot.style.top = `${100 - (Math.min(s.values[i], spec.max) / spec.max) * 100}%`;
    });
    const tip = $('.tip', el);
    tip.innerHTML = `${ago(i)}<br>${spec.series.map((s) => `${esc(s.name)} <b>${spec.fmt(s.values[i])}</b>`).join(' &nbsp; ')}`;
    tip.style.left = `${Math.min(Math.max(left, 18), 82)}%`;
  }
  function onChartLeave(e) {
    const el = e.target.closest?.('.chart');
    if (!el) return;
    el.classList.remove('hover');
    state.hovering = false;
  }

  // ---------------------------------------------------------------- views
  function viewMachines() {
    const items = attention();
    const alertHtml = items.length
      ? `<section><h2 class="section-title">Needs attention <span class="count">${items.length}</span></h2>
          <div class="attention">${items.map((a) => `
            <div class="alert ${a.level}">
              <span class="glyph">${a.icon}</span>
              <div><div class="what">${esc(a.what)}</div><div class="why">${esc(a.why)}</div></div>
              ${a.action.href ? `<a class="btn" href="${a.action.href}">${a.action.label}</a>` : `<button class="btn" type="button" data-act="${a.action.act}" data-id="${esc(a.action.id)}">${a.action.label}</button>`}
            </div>`).join('')}</div></section>`
      : `<p class="allclear"><span class="state good"><i></i></span>Nothing needs attention. All machines are reporting.</p>`;

    const cards = machines.map((m) => {
      const cpu = last(m.cpu), mem = last(m.mem), f = fullest(m), disk = fsPct(f), t = hottest(m);
      const own = items.filter((a) => a.machine === m.id);
      const mine = containers.filter((c) => c.machine === m.id);
      const up = mine.filter((c) => c.status === 'running').length;
      const status = own.length
        ? `<span class="state ${own[0].level}"><i></i>${esc(own[0].short)}${own.length > 1 ? `, +${own.length - 1} more` : ''}</span>`
        : `<span class="state good"><i></i>All good</span>`;
      return `<a class="machine" href="#machine-${m.id}">
        <div class="head"><span class="tape">${esc(m.name)}</span><span class="uptime">${m.uptimeShort}</span></div>
        <div class="readings">
          <div class="reading ${level(cpu, 85, 95)}"><div class="v">${Math.round(cpu)}<small>%</small></div><div class="l">CPU</div></div>
          <div class="reading ${level(mem, 85, 95)}"><div class="v">${Math.round(mem)}<small>%</small></div><div class="l">Memory</div></div>
          <div class="reading ${level(disk, 90, 97)}"><div class="v">${Math.round(disk)}<small>%</small></div><div class="l" title="Fullest disk: ${esc(f.mount)}">Disk</div></div>
          <div class="reading ${level(t.value, 80, 90)}"><div class="v">${t.value}<small>°C</small></div><div class="l">Temp</div></div>
        </div>
        ${spark(m.cpu, 100)}
        <div class="foot">${status}<span>${up} of ${mine.length} containers up</span></div>
      </a>`;
    }).join('');

    const favs = favorites.map((n) => services.find((s) => s.name === n)).map((s) => {
      const c = s.container && ctrByName(s.container);
      const off = c && c.status !== 'running';
      return `<button class="fav" type="button" data-act="open" data-id="${esc(s.name)}">
        <span class="mono-badge">${badgeInner(s)}${off ? `<span class="flag" style="background:var(--${c.status === 'restarting' ? 'critical' : 'muted'})" title="Not running"></span>` : ''}</span>${esc(s.name)}</button>`;
    }).join('');

    return `<div class="view-inner">
      <section><div class="section-title" style="justify-content:space-between"><h2 style="font-size:inherit">Favorites</h2><a class="link" href="#apps">All apps</a></div><div class="favs">${favs}</div></section>
      ${alertHtml}
      <section><h2 class="section-title">Machines <span class="count">${machines.length}</span></h2><div class="machines">${cards}</div></section>

    </div>`;
  }

  function viewMachine(id) {
    const m = machineById(id);
    if (!m) return viewNotFound();

    const procOpen = state.processes[m.id];

    const switcher = machines.length > 1
      ? `<div class="seg" role="group" aria-label="Machine">${machines.map((x) => `<button type="button" data-act="goto" data-id="${x.id}" aria-pressed="${x.id === m.id}">${esc(x.name)}</button>`).join('')}</div>`

            <div><div class="k">Processes</div><div class="v">${m.procs}</div></div>
            <div><div class="k">Threads</div><div class="v">${m.threads}</div></div>
          </div>
        </section>

        <section class="panel">
          <h2>Memory</h2>

          <div class="stack-bar" role="img" aria-label="Memory: used ${gb(p.used)}, buffers ${gb(p.buffers)}, cache ${gb(p.cache)}, free ${gb(p.free)}">
            ${seg(p.used, 'var(--s1)')}${seg(p.buffers, 'var(--s2)')}${seg(p.cache, 'var(--s3)')}${seg(p.free, 'var(--sunken)')}

            <div><div class="k"><i style="background:var(--s1)"></i>Used</div><div class="v">${gb(p.used)}</div></div>
            <div><div class="k"><i style="background:var(--s2)"></i>Buffers</div><div class="v">${gb(p.buffers)}</div></div>
            <div><div class="k"><i style="background:var(--s3)"></i>Cache</div><div class="v">${gb(p.cache)}</div></div>
            <div><div class="k"><i style="background:var(--sunken);outline:1px solid var(--line)"></i>Free</div><div class="v">${gb(p.free)}</div></div>
          </div>

            <div class="top-line"><span class="left">Swap</span><span class="right">${gb(m.swap.used)} of ${gb(m.swap.total)}</span></div>
            <div class="meter"><span style="width:${(m.swap.used / m.swap.total) * 100}%"></span></div>
          </div>
        </section>

        <section class="panel">
          <h2>Network</h2>
          <div class="headline"><span class="say">Down <b>${rate(last(m.rx))}</b>, up <b>${rate(last(m.tx))}</b></span></div>
          ${chart(`net-${m.id}`, [{ name: 'Down', color: 'var(--s1)', values: m.rx }, { name: 'Up', color: 'var(--s2)', values: m.tx }], { fmt: rate, label: 'Network throughput over the last 5 minutes' })}
          <div class="legend"><span><i style="background:var(--s1)"></i>Down</span><span><i style="background:var(--s2)"></i>Up</span></div>
          <table class="proc-table"><thead><tr><th>Interface</th><th>Down</th><th>Up</th><th>Total</th></tr></thead>
            <tbody>${m.ifaces.map((i) => `<tr><td>${esc(i.name)}</td><td>${i.rx}</td><td>${i.tx}</td><td>${i.total}</td></tr>`).join('')}</tbody></table>
        </section>

        <section class="panel">
          <h2>Storage</h2>
          ${m.fs.map((f) => {
            const p2 = fsPct(f), lv = level(p2, 90, 97);
            return `<div class="fs-row">
              <div class="top-line"><span class="left">${esc(f.mount)}</span><span class="right">${gb(f.used)} of ${gb(f.size)}${lv ? `, <span class="state ${lv}" style="font-size:inherit">${Math.round(p2)}% full</span>` : ''}</span></div>
              <div class="meter"><span style="width:${p2}%;background:${lv ? `var(--${lv})` : 'var(--s1)'}"></span></div>
            </div>`;
          }).join('')}
        </section>

        <section class="panel">
          <h2>Temperature</h2>
          <div class="sensor-list">${m.sensors.map((s) => `<div><span>${esc(s.label)}</span><span>${s.value}°C</span></div>`).join('')}</div>
        </section>

        <section class="panel">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
            <h2>Processes</h2>
            <button class="btn" type="button" data-act="procs" data-id="${m.id}" aria-expanded="${!!procOpen}">${procOpen ? 'Hide' : 'Show top processes'}</button>
          </div>
          ${procOpen
            ? `<table class="proc-table"><thead><tr><th>Name</th><th>CPU</th><th>Memory</th></tr></thead><tbody>${m.processes.map(([n, c, mb]) => `<tr><td>${esc(n)}</td><td>${c.toFixed(1)}%</td><td>${mb} MB</td></tr>`).join('')}</tbody></table>`
            : `<p class="note">Off by default. Listing processes costs ${esc(m.name)} noticeably more CPU, so it only runs while this is open.</p>`}

  }

  // Apps is the launcher: only what you can open right now. Stopped apps live
  // in Containers, which is where you'd start them.
  const isUp = (s) => !s.container || ctrByName(s.container).status === 'running';

  function viewApps() {
    const up = services.filter(isUp);
    const down = services.length - up.length;
    return `<div class="view-inner">
      <div class="page-head"><div><h1>Apps</h1><p class="sub">${up.length} running. Tap one to open it.</p></div></div>
      ${up.length ? `<div class="app-grid">${up.map((s) => `
        <button class="app-tile" type="button" data-act="open" data-id="${esc(s.name)}" title="${esc(s.desc)}">
          <span class="mono-badge">${badgeInner(s)}</span><span class="app-name">${esc(s.name)}</span>

    </div>`;
  }

  function viewContainers() {
    const m = machineById(state.ctrMachine);
    const mine = containers.filter((c) => c.machine === m.id);
    const counts = {
      all: mine.length,
      running: mine.filter((c) => c.status === 'running').length,
      stopped: mine.filter((c) => c.status !== 'running').length,
    };
    const shown = mine.filter((c) => state.ctrFilter === 'all' || (state.ctrFilter === 'running' ? c.status === 'running' : c.status !== 'running'));
    const trouble = mine.filter((c) => c.status === 'restarting' || c.status === 'dead');
    const summary = `${counts.running} of ${counts.all} running.` + (trouble.length ? ` ${trouble.map((c) => c.name).join(', ')} keeps restarting.` : '');
    const stacks = [...new Set(shown.map((c) => c.stack))].sort((a, b) => (a === null) - (b === null));

    const row = (c) => {
      const st = c.status === 'running' ? '' : c.status === 'restarting' ? '<span class="state critical"><i></i>Restarting</span>' : '<span class="state muted"><i></i>Stopped</span>';
      return `<button class="row" type="button" data-act="ctr" data-id="${esc(c.name)}">
        <span class="txt" style="flex:1"><div class="name">${esc(c.name)}</div><div class="desc mono">${esc(c.image)}</div></span>
        ${st || `<span class="meta"><div>${c.cpu.toFixed(1)}% CPU</div><div>${c.mem} MB</div></span>`}
      </button>`;
    };

    return `<div class="view-inner">
      <div class="page-head" style="flex-wrap:wrap">
        <div><h1>Containers</h1><p class="sub">${esc(summary)}</p></div>
        <div class="seg" role="group" aria-label="Machine">${machines.map((x) => `<button type="button" data-act="ctr-machine" data-id="${x.id}" aria-pressed="${x.id === m.id}">${esc(x.name)}</button>`).join('')}</div>
      </div>
      ${m.local ? '' : `<p class="note">View only. helm runs on Basestation, so it can start and stop containers there but only watch them on ${esc(m.name)}.</p>`}
      <div class="chips" role="group" aria-label="Filter">
        ${[['all', 'All'], ['running', 'Running'], ['stopped', 'Stopped']].map(([k, l]) => `<button class="chip" type="button" data-act="filter" data-id="${k}" aria-pressed="${state.ctrFilter === k}">${l}<span class="n">${counts[k]}</span></button>`).join('')}
      </div>
      ${shown.length ? `<div class="groups">${stacks.map((s) => {
        const inStack = mine.filter((c) => c.stack === s);

  function viewTerminal() {

      <div class="term-tools">

  function viewNotFound() {

  // ---------------------------------------------------------------- sheet

        <div>

          <div class="logs" translate="no">${logsFor(c).map(([t, line, err]) => `<span class="d" style="color:#8a929a">${t}</span>  ${err ? `<span class="e">${esc(line)}</span>` : esc(line)}`).join('\n')}</div>
        </div>

  }

  function sheetStack(name) {
    const inStack = containers.filter((c) => c.stack === name);
    const upN = inStack.filter((c) => c.status === 'running').length;
    const armedDown = state.armed === `down:${name}`;
    const file = stackFiles[name] ?? `services:\n${inStack.map((c) => `  ${c.name}:\n    image: ${c.image}\n    restart: unless-stopped`).join('\n')}`;
    return `
      <div class="sheet-head">
        <div><h2>${esc(name)}</h2><p class="sub">Stack on Basestation, ${upN} of ${inStack.length} containers up</p></div>
        <button class="iconbtn" type="button" data-act="close" aria-label="Close">${icons.close}</button>
      </div>
      <div class="sheet-body">
        <div class="actions">
          <button class="btn primary" type="button" data-act="stack-up" data-id="${esc(name)}">Start all</button>
          <button class="btn" type="button" data-act="stack-restart" data-id="${esc(name)}">Restart all</button>
          <button class="btn danger ${armedDown ? 'armed' : ''}" type="button" data-act="stack-down" data-id="${esc(name)}">${armedDown ? 'Tap again to stop all' : 'Stop all'}</button>
        </div>
        <div>
          <div class="group-title" style="margin-inline:0"><label for="compose">compose.yaml</label><span>/opt/stacks/${esc(name)}</span></div>
          <textarea class="compose" id="compose" name="compose" spellcheck="false">${esc(file)}</textarea>
        </div>
        <div class="actions"><button class="btn" type="button" data-act="save-compose" data-id="${esc(name)}">Save file</button></div>
        <p style="color:var(--muted);font-size:13.5px">helm checks the file with <code>compose config</code> before saving and keeps the previous version as compose.yaml.bak.</p>
      </div>`;
  }

  function renderSheet() {
    const sheet = $('#sheet'), scrim = $('#scrim');
    if (!state.sheet) {
      sheet.classList.remove('open');
      scrim.classList.remove('open');
      sheet.setAttribute('aria-hidden', 'true');
      return;
    }
    const { type, id } = state.sheet;
    sheet.innerHTML = `<div class="grab"></div>${type === 'ctr' ? sheetContainer(ctrByName(id)) : sheetStack(id)}`;
    sheet.classList.add('open');
    scrim.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
  }
  function openSheet(type, id) {
    const wasOpen = !!state.sheet;
    state.sheet = { type, id };
    state.armed = null;
    renderSheet();
    if (!wasOpen) setTimeout(() => $('#sheet .iconbtn')?.focus({ preventScroll: true }), 50);
  }
  function closeSheet() {
    state.sheet = null;
    state.armed = null;
    renderSheet();
  }

  // ---------------------------------------------------------------- toast
  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }

  // ---------------------------------------------------------------- routing
  // Routing lives in page state so it works anywhere (file://, data:, served);
  // the hash is kept in sync where the browser allows, for bookmarking.
  let current = location.hash.replace('#', '') || 'machines';
  function go(h) {
    current = h;
    try { if (location.hash !== `#${h}`) history.replaceState(null, '', `#${h}`); } catch { /* not addressable here */ }
    closeSheet();
    render();
    $('#view').scrollTop = 0;
    $('#view').focus({ preventScroll: true });
  }
  function route() {
    const h = current;
    if (h.startsWith('machine-')) return { name: 'machine', id: h.slice(8) };
    return { name: h };
  }
  function render() {
    const r = route();
    const view = $('#view');
    const navRoute = r.name === 'machine' ? 'machines' : r.name;
    const navHtml = NAV.map((n) => `<a href="#${n.route}" ${n.route === navRoute ? 'aria-current="page"' : ''}>`);
    $('#topnav').innerHTML = NAV.map((n, i) => `${navHtml[i]}${n.label}</a>`).join('');
    $('#tabbar').innerHTML = NAV.map((n, i) => `${navHtml[i]}<span class="ico">${n.icon}</span>${n.label}</a>`).join('');
    view.classList.toggle('term-view', r.name === 'terminal');
    const html = {
      machines: viewMachines,
      machine: () => viewMachine(r.id),
      apps: viewApps,
      containers: viewContainers,
      terminal: viewTerminal,
    }[r.name] ?? viewNotFound;
    view.innerHTML = html();
    if (r.name === 'terminal') { const t = $('#term'); t.scrollTop = t.scrollHeight; }
  }
  window.addEventListener('hashchange', () => {
    const h = location.hash.replace('#', '');
    if (h && h !== current) go(h);
  });

  // ---------------------------------------------------------------- actions
  let armTimer;
  function arm(key) {
    state.armed = key;
    clearTimeout(armTimer);
    armTimer = setTimeout(() => { state.armed = null; refreshOpen(); }, 3500);
  }
  function refreshOpen() {
    if (state.sheet) renderSheet();
    const r = route().name;
    if (r === 'containers' || r === 'apps' || r === 'terminal' || r === 'machines') render();
  }
  function setStatus(name, status, msg) {
    const c = ctrByName(name);
    c.status = status;
    if (status === 'running') { c.cpu = 0.4 + jitter(); c.mem = 60 + Math.round(jitter() * 120); c.up = 'a few seconds'; }
    else { c.cpu = 0; c.mem = 0; c.up = ''; }
    state.armed = null;
    toast(msg);
    refreshOpen();
  }
  function termWrite(cmd, out) {
    state.term.push(['', `${cmd}\n`]);
    for (const line of out) state.term.push([line[0], `${line[1]}\n`]);
    state.term.push(['p', 'matt@basestation:~$ ']);
    if (route().name === 'terminal') render();
  }

  document.addEventListener('click', (e) => {
    const link = e.target.closest('a[href^="#"]');
    if (link && link.getAttribute('href') !== '#view') {
      e.preventDefault();
      go(link.getAttribute('href').slice(1));
      return;
    }
    const el = e.target.closest('[data-act], [data-preview], [data-theme-set]');
    if (!el) return;
    if (el.dataset.preview) {
      $('#stage').classList.toggle('phone', el.dataset.preview === 'phone');
      document.querySelectorAll('[data-preview]').forEach((b) => b.setAttribute('aria-pressed', b === el));
      return;
    }
    if (el.dataset.themeSet) {
      const v = el.dataset.themeSet;
      if (v === 'system') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', v);
      document.querySelectorAll('[data-theme-set]').forEach((b) => b.setAttribute('aria-pressed', b === el));
      return;
    }
    const { act, id } = el.dataset;
    switch (act) {
      case 'goto': go(`machine-${id}`); break;
      case 'open': {
        const s = services.find((x) => x.name === id);
        toast(`Opening ${s.name} at ${s.url.replace(/^https?:\/\//, '')}`);
        break;
      }
      case 'ctr': openSheet('ctr', id); break;
      case 'stack': openSheet('stack', id); break;
      case 'close': closeSheet(); break;
      case 'procs': state.processes[id] = !state.processes[id]; render(); break;
      case 'ctr-machine': state.ctrMachine = id; render(); break;
      case 'filter': state.ctrFilter = id; render(); break;
      case 'start': setStatus(id, 'running', `Started ${id}`); break;
      case 'restart': setStatus(id, 'running', `Restarted ${id}`); break;
      case 'stop':
        if (state.armed === `stop:${id}`) setStatus(id, 'exited', `Stopped ${id}`);
        else { arm(`stop:${id}`); renderSheet(); }
        break;
      case 'stack-up':
        containers.filter((c) => c.stack === id).forEach((c) => { if (c.status !== 'running') { c.status = 'running'; c.cpu = 0.3; c.mem = 90; c.up = 'a few seconds'; } });
        toast(`Started all of ${id}`); refreshOpen(); break;
      case 'stack-restart': toast(`Restarted all of ${id}`); break;
      case 'stack-down':
        if (state.armed === `down:${id}`) {
          containers.filter((c) => c.stack === id).forEach((c) => { c.status = 'exited'; c.cpu = 0; c.mem = 0; c.up = ''; });
          state.armed = null; toast(`Stopped all of ${id}`); refreshOpen();
        } else { arm(`down:${id}`); renderSheet(); }
        break;
      case 'save-compose': toast('Saved compose.yaml. The previous version is in compose.yaml.bak'); break;
      case 'toast': toast(id); break;
      case 'key': toast(`Sent ${id}`); $('#term-in')?.focus(); break;
      case 'cmd':
        if (id === 'sudo systemctl reboot') {
          if (state.armed === 'cmd:reboot') { state.armed = null; termWrite(id, [['d', 'Prototype: reboot not sent.']]); }
          else { arm('cmd:reboot'); render(); }
          break;
        }
        termWrite(id, id === 'df -h'
          ? [['', 'Filesystem      Size  Used Avail Use% Mounted on'], ['', '/dev/sda2       118G   42G   76G  35% /'], ['', '/dev/sdb1       3.7T  2.8T  910G  76% /mnt/media']]
          : [['d', 'Prototype: sample output only.']]);
        break;
    }
  });

  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'term-form') return;
    e.preventDefault();
    const input = $('#term-in');
    const cmd = input.value.trim();
    if (!cmd) return;
    termWrite(cmd, [['d', 'Prototype: commands are not run.']]);
    $('#term-in')?.focus();
  });
  $('#scrim').addEventListener('click', closeSheet);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.sheet) closeSheet(); });
  $('#view').addEventListener('pointermove', onChartMove);
  $('#view').addEventListener('pointerout', (e) => { if (!e.relatedTarget?.closest?.('.chart')) onChartLeave(e); });

  // ---------------------------------------------------------------- live tick
  setInterval(() => {
    for (const m of machines) {
      for (const [k, base, spread, hi] of [['cpu', m.id === 'basestation' ? 6 : 24, m.id === 'basestation' ? 5 : 10, 100], ['mem', m.id === 'basestation' ? 17.6 : 61, 1.2, 100], ['rx', 6, 7, 80], ['tx', 3, 4, 60]]) {
        const prev = last(m[k]);
        let v = prev + (jitter() - 0.5) * spread;
        v += (base - v) * 0.2;
        m[k].push(Math.min(hi, Math.max(0, v)));
        m[k].shift();
      }
    }
    const r = route().name;
    if ((r === 'machines' || r === 'machine') && !state.hovering && !state.sheet) {
      const v = $('#view'), y = v.scrollTop;
      render();
      v.scrollTop = y;
    }
  }, STEP_S * 1000);

  render();
})();
</script>
</body>
</html>
